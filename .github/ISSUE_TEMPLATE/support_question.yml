name: "💬 Dúvida de Uso ou Configuração (Question)"
description: Faça uma pergunta ou peça ajuda para configurar um workflow no seu projeto.
title: "[Question]: "
labels:
  - question
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Tem uma dúvida de arquitetura ou como usar os workflows?
        Antes de enviar, recomendamos verificar se a dúvida já foi respondida no [README.md](./blob/main/README.md) ou nas [Issues Fechadas](./issues?q=is%3Aissue+is%3Aclosed).

  - type: textarea
    id: question
    attributes:
      label: "Qual é a sua dúvida?"
      description: "Explique com o máximo de detalhes o que você deseja alcançar no seu pipeline."
    validations:
      required: true

  - type: textarea
    id: project-context
    attributes:
      label: "Contexto do seu Projeto"
      description: "Qual é a stack da aplicação (Node, PHP, .NET, Python, Go)? Como está estruturado o repositório (raiz ou subpasta)?"
    validations:
      required: false

  - type: textarea
    id: workflow-example
    attributes:
      label: "Workflow Utilizado (Opcional)"
      description: "Cole aqui como você tentou chamar a action ou workflow reutilizável."
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "Confirmações"
      options:
        - label: "Consultei os exemplos no README.md antes de abrir esta dúvida."
          required: true
