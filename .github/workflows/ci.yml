name: CI - Engine Test & Build Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🧪 Typecheck, Tests & Build Validation
    runs-on: ubuntu-latest
    permissions:
      contents: write # 👈 Permite ao GITHUB_TOKEN fazer commit e push na branch

    steps:
      - name: 📌 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }} # 👈 Garante checkout na branch real (não no merge-commit temporário do PR)
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

    #   - name: 🔍 Typecheck TypeScript
    #     run: npm run typecheck

      - name: 🧪 Execute Vitest Test Suite
        run: npm run test

      - name: 🏗️ Verify Bundles Build
        run: npm run build

      # - name: 🚨 Verify Dist is Up-to-date
      #   run: |
      #     if [[ -n $(git status --porcelain dist) ]]; then
      #       echo "::error::Os arquivos em dist/ não estão atualizados em relação ao código TypeScript em src/! Execute 'npm run build' e comite as alterações."
      #       git status --porcelain dist
      #       exit 1
      #     fi

      - name: 🤖 Commit and Push dist if changed
        run: |
          if [[ -n $(git status --porcelain dist) ]]; then
            echo "⚡ Alterações detectadas em dist/! Realizando auto-commit..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "chore(dist): 🤖 auto-compile action bundles [skip ci]"
            git push
          else
            echo "✅ Bundles em dist/ já estão perfeitamente sincronizados."
          fi
