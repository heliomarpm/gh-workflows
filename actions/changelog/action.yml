name: 'Changelog Engine'
description: 'Gerador de changelog Conventional Commits com ciclo de vida [Unreleased]'

inputs:
  changelog-file:
    description: 'Caminho do arquivo de changelog'
    required: false
    default: 'CHANGELOG.md'
  changelog-title:
    description: 'Título do arquivo de changelog'
    required: false
    default: |
      # 📦 Changelog

      Todas as alterações notáveis neste projeto serão documentadas neste arquivo.

      O formato é baseado no [Keep a Changelog](https://keepachangelog.com/pt-BR/1.1.0/) e este projeto adere ao [Semantic Versioning](https://semver.org/lang/pt-BR/).
  commit-message:
    description: 'Mensagem de commit customizada para atualizações do changelog'
    required: false
    default: ''

  version:
    description: 'Versão do changelog (ex: 1.0.0, 2026-10-03, ou Unreleased)'
    required: false
    default: ''
  release-notes:
    description: 'Notas de release pré-calculadas em formato Markdown'
    required: false
    default: ''
  branch:
    description: 'Nome do branch atual (detectado automaticamente pelo ambiente/git se vazio)'
    required: false
    default: ''

  enable-changelog:
    description: 'Habilita a criação do changelog'
    required: false
    type: boolean
    default: true

outputs:
  version:
    description: 'Versão aplicada (ex: 1.0.0, 2026-10-03, ou Unreleased)'
  has-changes:
    description: 'Se alterações foram detectadas e escritas (true/false)'
  release-notes:
    description: 'Notas de release em markdown geradas para este ciclo'

runs:
  using: 'node24'
  main: '../../dist/changelog/index.js'
